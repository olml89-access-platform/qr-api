name: PR Automation

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number to synchronize
        required: true
        type: number

jobs:
  synchronize:
    uses: olml89-access-platform/.github/.github/workflows/pr-automation.yml@main
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}
